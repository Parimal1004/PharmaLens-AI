<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PharmaLens AI logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- lens ring -->
  <circle cx="28" cy="28" r="15" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>
  <!-- lens handle -->
  <line x1="39.5" y1="39.5" x2="51" y2="51" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- molecule (benzene ring) inside the lens -->
  <polygon points="28,21 34.06,24.5 34.06,31.5 28,35 21.94,31.5 21.94,24.5"
           fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2" stroke-linejoin="round"/>
  <g fill="#C7D2FE">
    <circle cx="28" cy="21" r="2.2"/>
    <circle cx="34.06" cy="24.5" r="2.2"/>
    <circle cx="34.06" cy="31.5" r="2.2"/>
    <circle cx="28" cy="35" r="2.2"/>
    <circle cx="21.94" cy="31.5" r="2.2"/>
    <circle cx="21.94" cy="24.5" r="2.2"/>
  </g>
</svg>
